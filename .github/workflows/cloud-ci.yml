name: Cloud deployment checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-web.lock.txt httpx==0.28.1
      - name: Verify account and banking behavior
        run: python -m unittest discover -v
      - name: Verify frontend workflows
        run: |
          npm install --no-save --prefix .build_frontend jsdom@30.1.2
          node scripts/verify_frontend.mjs
          node scripts/verify_streaming.mjs
          node scripts/verify_scenarios.mjs
      - name: Build the deployment image
        run: docker build -t campusbank-ci .
      - name: Verify Docker workflow and persistent records
        run: |
          docker run -d --name campusbank-ci-smoke -p 127.0.0.1:8511:8080 \
            -e BANKBOT_PUBLIC_URL=https://campusbank.example \
            -e BANKBOT_BOOTSTRAP_CODE=synthetic-bootstrap-for-disposable-ci \
            -e BANKBOT_TEST_ACCESS_CODE=synthetic-test-access-for-ci \
            -v campusbank-ci-data:/data campusbank-ci
          python scripts/verify_cloud_container.py --state "$RUNNER_TEMP/cloud-smoke.json"
          docker restart campusbank-ci-smoke
          python scripts/verify_cloud_container.py --state "$RUNNER_TEMP/cloud-smoke.json" --verify-restart
      - name: Container diagnostics
        if: failure()
        run: docker logs campusbank-ci-smoke || true
