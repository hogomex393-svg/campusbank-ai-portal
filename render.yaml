services:
  - type: web
    name: bankflow-ai
    runtime: docker
    plan: free
    region: frankfurt
    numInstances: 1
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: BANKBOT_DEPLOYMENT
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: BANKBOT_BOOTSTRAP_CODE
        sync: false
      - key: BANKBOT_TEST_ACCESS_CODE
        sync: false
      - key: BANKBOT_STAFF_ACCESS_CODE
        sync: false
      - key: BANKBOT_OPEN_STAFF_TESTING
        value: "false"
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
